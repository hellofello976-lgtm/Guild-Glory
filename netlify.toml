# Guild Glory - Combined Repo Configuration
# For repos with both web (HTML/JS) and Python (Flask) backend

[build]
  publish = "."
  command = "echo 'Static site mode - Python backend runs separately'"

# Serve index.html for all routes (SPA routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Development server
[dev]
  command = "python app.py"
  port = 5000
  targetPort = 5000
  framework = "python"

# Production environment variables
[env.production]
  FLASK_ENV = "production"
  DEBUG = "False"
  NODE_ENV = "production"

# Cache settings
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
